[workspace]
resolver = "2"
members = [
    "nixyon-core",
    "nixyon-audio",
    "nixyon-cluster",
    "nixyon-pipeline",
    "nixyon-render",
    "nixyon-locales",
    "nixyon-sherpa",
    "nixyon-ort",
    "nixyon-metrics",
    "nixyon-eval",
]
exclude = ["nixyon-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["BorisMalts"]
publish = false

# Все версии зависимостей только здесь, в крейтах: `dep = { workspace = true }`.
[workspace.dependencies]
nixyon-core = { path = "nixyon-core" }
nixyon-audio = { path = "nixyon-audio" }
nixyon-cluster = { path = "nixyon-cluster" }
nixyon-pipeline = { path = "nixyon-pipeline" }
nixyon-render = { path = "nixyon-render" }
nixyon-locales = { path = "nixyon-locales" }
nixyon-metrics = { path = "nixyon-metrics" }
nixyon-sherpa = { path = "nixyon-sherpa" }
nixyon-ort = { path = "nixyon-ort" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
sherpa-onnx = "2.0.1"
rubato = "5.0.1"
# Без своих бинарников: линкуется с ONNX Runtime 1.28 из sherpa-onnx (ORT_LIB_LOCATION).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-28"] }
realfft = "3.5.1"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
rust-stemmers = "1.2.0"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "vorbis"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1

# Быстрая пересборка для внутреннего цикла: без LTO, много единиц кодогенерации.
[profile.fast]
inherits = "dev"
opt-level = 1
codegen-units = 16
incremental = true
